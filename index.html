  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Firestore doc IDs can't contain "/", so swap it out just in case.
  function safeId(key) {
    return key.replace(/\//g, "__");
  }

  // This mimics the same window.storage API the original artifact used,
  // but backed by Firestore instead of Claude's built-in storage.
  window.storage = {
    async get(key) {
      const snap = await db.collection("storage").doc(safeId(key)).get();
      if (!snap.exists) return null;
      return { key, value: snap.data().value, shared: true };
    },
    async set(key, value) {
      await db.collection("storage").doc(safeId(key)).set({
        value,
        updatedAt: Date.now(),
      });
      return { key, value, shared: true };
    },
    async delete(key) {
      await db.collection("storage").doc(safeId(key)).delete();
      return { key, deleted: true, shared: true };
    },
    async list(prefix) {
      const snap = await db.collection("storage").get();
      const keys = [];
      snap.forEach((doc) => {
        if (!prefix || doc.id.startsWith(safeId(prefix))) keys.push(doc.id);
      });
      return { keys, prefix, shared: true };
    },
  };
</script>

function deepMerge(base, override) {
  const out = JSON.parse(JSON.stringify(base));
  if (!override) return out;
  Object.keys(override).forEach((k) => {
    if (
      typeof override[k] === "object" &&
      override[k] !== null &&
      !Array.isArray(override[k]) &&
      typeof out[k] === "object"
    ) {
      out[k] = { ...out[k], ...override[k] };
    } else {
      out[k] = override[k];
    }
  });
  return out;
}

function escapeSafe(str) {
  return (str || "").toString();
}

function uid() {

function isImageUrl(str) {

}
function polaroidTilt(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 997;
  return (h % 13) - 6; // da -6 a +6 gradi
}
function isLikelyEmoji(str) {
  return str.length <= 6 && /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u.test(str);
}
function cardBgStyleStatic(bg) {
  if (!bg) return undefined;

  };
}

/* ---------------- IMAGE COMPRESSION ---------------- */
function fileToCompressedDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("lettura file fallita"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("immagine non valida"));
      img.onload = () => {
        let { width, height } = img;
        if (width > MAX_PHOTO_DIM || height > MAX_PHOTO_DIM) {
          if (width > height) {
            height = Math.round((height * MAX_PHOTO_DIM) / width);
            width = MAX_PHOTO_DIM;
          } else {
            width = Math.round((width * MAX_PHOTO_DIM) / height);
            height = MAX_PHOTO_DIM;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", JPEG_QUALITY));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function BirthdayWorld() {
  const [state, setState] = useState(DEFAULT_STATE);

  const [savedFlash, setSavedFlash] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [pinPrompt, setPinPrompt] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState("");
  const [zoomedPhotoId, setZoomedPhotoId] = useState(null);

  const stateRef = useRef(state);
  stateRef.current = state;
  const suppressPoll = useRef(false);
  const saveTimer = useRef(null);
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const doodleColor = useRef("#eaf1ff");
  const fileInputRef = useRef(null);
  const wrapRef = useRef(null);
  const decorRef = useRef(null);

  const loadPhoto = useCallback(async (id) => {
    try {
      const res = await window.storage.get(`photo:${id}`, true);
      if (res && res.value) {
        setPhotoCache((prev) => ({ ...prev, [id]: res.value }));
      }
    } catch (e) {}
  }, []);

  const syncMissingPhotos = useCallback(
    (items) => {
      items.forEach((it) => {
        if (it.kind === "upload" && !photoCache[it.id]) {
          loadPhoto(it.id);
        }
      });
    },
    [photoCache, loadPhoto]
  );

  const loadAll = useCallback(async () => {
    try {
      const res = await window.storage.get(STATE_KEY, true);
      if (res && res.value) {
        const parsed = JSON.parse(res.value);
        const merged = deepMerge(DEFAULT_STATE, parsed);
        setState(merged);
        syncMissingPhotos(merged.galleryItems || []);
      }
    } catch (e) {}
    try {
      const dres = await window.storage.get("doodle-v1", true);
      if (dres && dres.value) setDoodleData(dres.value);
    } catch (e) {}
    try {
      const pres = await window.storage.get("pfp-photo-v1", true);
      if (pres && pres.value) setPfpPhotoData(pres.value);
    } catch (e) {}
    setLoaded(true);
  }, [syncMissingPhotos]);

  useEffect(() => {
    loadAll();
  }, []);

  useEffect(() => {
    const interval = setInterval(async () => {
      if (editMode || suppressPoll.current) return;
      try {
        const res = await window.storage.get(STATE_KEY, true);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          if (JSON.stringify(parsed) !== JSON.stringify(stateRef.current)) {
            const merged = deepMerge(DEFAULT_STATE, parsed);
            setState(merged);
            syncMissingPhotos(merged.galleryItems || []);
          }
        }
      } catch (e) {}
      try {
        const dres = await window.storage.get("doodle-v1", true);
        if (dres && dres.value && dres.value !== doodleData) {
          setDoodleData(dres.value);
        }
      } catch (e) {}
      try {
        const pres = await window.storage.get("pfp-photo-v1", true);
        if (pres && pres.value && pres.value !== pfpPhotoData) {
          setPfpPhotoData(pres.value);
        }
      } catch (e) {}
    }, POLL_MS);
    return () => clearInterval(interval);
  }, [editMode, doodleData, pfpPhotoData]);

  const persist = useCallback((next, immediate) => {
    setState(next);
    clearTimeout(saveTimer.current);
    const doSave = async () => {
      try {
        suppressPoll.current = true;
        await window.storage.set(STATE_KEY, JSON.stringify(next), true);
        setSavedFlash(true);
        setTimeout(() => setSavedFlash(false), 1200);
      } catch (e) {
        console.error("save failed", e);
      }
      setTimeout(() => {
        suppressPoll.current = false;
      }, 1200);
    };
    if (immediate) doSave();
    else saveTimer.current = setTimeout(doSave, 500);
  }, []);

  const update = useCallback(
    (patch, immediate) => {
      const next = typeof patch === "function" ? patch(stateRef.current) : { ...stateRef.current, ...patch };
      persist(next, immediate);
    },
    [persist]
  );

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (doodleData) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = doodleData;
    }
  }, [doodleData, loaded]);

  function getCanvasPos(e) {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }
  function onDoodleDown(e) {
    drawing.current = true;
    const ctx = canvasRef.current.getContext("2d");
    const p = getCanvasPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    canvasRef.current.setPointerCapture(e.pointerId);
  }
  function onDoodleMove(e) {
    if (!drawing.current) return;
    const ctx = canvasRef.current.getContext("2d");
    const p = getCanvasPos(e);
    ctx.strokeStyle = doodleColor.current;
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  async function onDoodleUp() {
    if (!drawing.current) return;
    drawing.current = false;
    const dataUrl = canvasRef.current.toDataURL("image/png");
    setDoodleData(dataUrl);
    try {
      suppressPoll.current = true;
      await window.storage.set("doodle-v1", dataUrl, true);
    } catch (e) {}
    setTimeout(() => {
      suppressPoll.current = false;
    }, 1200);
  }
  async function clearDoodle() {
    const canvas = canvasRef.current;
    canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
    setDoodleData("");
    try {
      await window.storage.set("doodle-v1", "", true);
    } catch (e) {}
  }

  function addPhotoByUrl(url) {
    if (!url.trim()) return;
    const item = { id: uid(), kind: "url", url: url.trim() };
    update((s) => ({ ...s, galleryItems: [...s.galleryItems, item] }));
  }

  async function handleFilePick(e) {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    setUploading(true);
    try {
      for (const file of files) {
        const dataUrl = await fileToCompressedDataUrl(file);
        const id = uid();
        try {
          await window.storage.set(`photo:${id}`, dataUrl, true);
          setPhotoCache((prev) => ({ ...prev, [id]: dataUrl }));
          update((s) => ({ ...s, galleryItems: [...s.galleryItems, { id, kind: "upload" }] }), true);
        } catch (err) {
          console.error("upload failed", err);
        }
      }
    } finally {
      setUploading(false);
      if (fileInputRef.current) fileInputRef.current.value = "";
    }
  }

  async function handlePfpFilePick(e) {
    const file = (e.target.files || [])[0];
    if (!file) return;
    setPfpUploading(true);
    try {
      const dataUrl = await fileToCompressedDataUrl(file);
      await window.storage.set("pfp-photo-v1", dataUrl, true);
      setPfpPhotoData(dataUrl);
      update({ pfpMode: "upload" }, true);
    } catch (err) {
      console.error("upload foto profilo fallito", err);
    } finally {
      setPfpUploading(false);
      if (pfpFileInputRef.current) pfpFileInputRef.current.value = "";
    }
  }

  async function deletePhoto(item) {
    update((s) => ({ ...s, galleryItems: s.galleryItems.filter((g) => g.id !== item.id) }));
    if (item.kind === "upload") {
      try {
        await window.storage.delete(`photo:${item.id}`, true);

  function addSticker(content) {
    const st = {
      id: uid(),
      content,
      xPct: 20 + Math.random() * 60,
      yPct: 12 + Math.random() * 20,
      rot: Math.floor(Math.random() * 30 - 15),

    update((s) => ({ ...s, stickers: [...s.stickers, st] }));
  }
  function removeSticker(id) {
    update((s) => ({ ...s, stickers: s.stickers.filter((x) => x.id !== id) }));
  }
  function moveSticker(id, xPct, yPct) {
    update((s) => ({ ...s, stickers: s.stickers.map((x) => (x.id === id ? { ...x, xPct, yPct } : x)) }));

  function cycleMoon(id) {
    update((s) => ({
      ...s,
      stickers: s.stickers.map((x) => {
        if (x.id !== id) return x;
        let idx = MOON_PHASES.indexOf(x.content);

        return { ...x, content: MOON_PHASES[(idx + 1) % MOON_PHASES.length] };

  }

  function toggleSectionVisible(key) {
    update((s) => ({ ...s, sectionVisible: { ...s.sectionVisible, [key]: s.sectionVisible[key] === false } }));

  function updateCardPos(key, patch) {

  }

    updateCardPos(key, { bg: url });

    const ys = [
      ...Object.values(state.cardPos || {}).map((p) => p.yPx || 0),
      ...(state.customCards || []).map((c) => c.pos.yPx || 0),

function EditableText({ tag: Tag, className, editable, value, onChange, multiline }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && ref.current.textContent !== value) ref.current.textContent = value;
  }, [value]);
  return (
    <Tag
      ref={ref}
      className={className + " editable" + (editable ? " editing" : "")}
      contentEditable={editable}
      suppressContentEditableWarning
      onBlur={(e) => onChange(e.target.textContent)}
      style={multiline ? { whiteSpace: "pre-wrap" } : undefined}
    />
  );
}

function FreeCard({ pos, editMode, wrapRef, onMove, onResize, children }) {
  const elRef = useRef(null);
  const dragging = useRef(false);
  const resizing = useRef(false);
  const start = useRef({ x: 0, y: 0 });
  const orig = useRef({ xPct: pos.xPct, yPx: pos.yPx, wPct: pos.wPct });

  function onHandleDown(e) {
    e.preventDefault();
    dragging.current = true;
    start.current = { x: e.clientX, y: e.clientY };
    orig.current = { xPct: pos.xPct, yPx: pos.yPx, wPct: pos.wPct };
    e.currentTarget.setPointerCapture(e.pointerId);
  }
  function onHandleMove(e) {
    if (!dragging.current || !editMode || !wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    const dx = e.clientX - start.current.x;
    const dy = e.clientY - start.current.y;
    const xPct = Math.min(100 - orig.current.wPct, Math.max(0, orig.current.xPct + (dx / rect.width) * 100));
    const yPx = Math.max(0, orig.current.yPx + dy);
    if (elRef.current) {
      elRef.current.style.left = xPct + "%";
      elRef.current.style.top = yPx + "px";
      elRef.current._pendingX = xPct;
      elRef.current._pendingY = yPx;
    }
  }
  function onHandleUp() {
    if (!dragging.current) return;
    dragging.current = false;
    if (elRef.current && elRef.current._pendingX != null) {
      onMove(elRef.current._pendingX, elRef.current._pendingY);
    }
  }
  function onResizeDown(e) {
    e.preventDefault();
    e.stopPropagation();
    resizing.current = true;
    start.current = { x: e.clientX, y: e.clientY };
    orig.current = { ...orig.current, wPct: pos.wPct };
    e.currentTarget.setPointerCapture(e.pointerId);
  }
  function onResizeMove(e) {
    if (!resizing.current || !editMode || !wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    const dx = e.clientX - start.current.x;
    const wPct = Math.min(96 - pos.xPct, Math.max(20, orig.current.wPct + (dx / rect.width) * 100));
    if (elRef.current) {
      elRef.current.style.width = wPct + "%";
      elRef.current._pendingW = wPct;
    }
  }
  function onResizeUp() {
    if (!resizing.current) return;
    resizing.current = false;
    if (elRef.current && elRef.current._pendingW != null) {
      onResize(elRef.current._pendingW);
    }
  }

  return (
    <div
      ref={elRef}
      className={"free-card" + (editMode ? " editing" : "")}
      style={{ left: pos.xPct + "%", top: pos.yPx + "px", width: pos.wPct + "%" }}
    >
      {editMode && (
        <div className="drag-handle" onPointerDown={onHandleDown} onPointerMove={onHandleMove} onPointerUp={onHandleUp}>
          ⠿ trascina
        </div>
      )}
      {children}
      {editMode && (
        <div className="resize-handle" onPointerDown={onResizeDown} onPointerMove={onResizeMove} onPointerUp={onResizeUp}>
          ↘
        </div>
      )}
    </div>
  );
}

function Sticker({ st, editMode, wrapRef, onMove, onDelete, onTap }) {
  const elRef = useRef(null);
  const dragging = useRef(false);
  const moved = useRef(false);
  const start = useRef({ x: 0, y: 0 });
  const orig = useRef({ x: st.xPct, y: st.yPct });

  const isImg = isImageUrl(st.content);
  const isText = !isImg && !isLikelyEmoji(st.content);

  function onDown(e) {
    e.preventDefault();
    dragging.current = true;
    moved.current = false;
    start.current = { x: e.clientX, y: e.clientY };
    orig.current = { x: st.xPct, y: st.yPct };
    e.currentTarget.setPointerCapture(e.pointerId);
  }
  function onMoveEv(e) {
    if (!dragging.current || !editMode) return;
    const dx = e.clientX - start.current.x;
    const dy = e.clientY - start.current.y;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved.current = true;
    if (!moved.current || !wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    const layerHeight = wrapRef.current.scrollHeight;
    const xPct = Math.min(96, Math.max(0, orig.current.x + (dx / rect.width) * 100));
    const yPct = Math.min(99, Math.max(0, orig.current.y + (dy / layerHeight) * 100));
    if (elRef.current) {
      elRef.current.style.left = xPct + "%";
      elRef.current.style.top = yPct + "%";
    }
    st._pendingX = xPct;
    st._pendingY = yPct;
  }
  function onUp() {
    if (!dragging.current) return;
    dragging.current = false;
    if (editMode) {
      if (moved.current && st._pendingX != null) {
        onMove(st._pendingX, st._pendingY);
      } else if (!moved.current) {
        onDelete();
      }
    } else {
      if (onTap) onTap();
      if (elRef.current) {
        elRef.current.classList.remove("idle-bob");
        elRef.current.classList.add("bloom");
        setTimeout(() => {
          if (elRef.current) {
            elRef.current.classList.remove("bloom");
            elRef.current.classList.add("idle-bob");
          }
        }, 520);
      }
    }
  }

  return (
    <div
      ref={elRef}
      className={"sticker idle-bob" + (isText ? " text-sticker" : "")}
      style={{ left: st.xPct + "%", top: st.yPct + "%", "--rot": (st.rot || 0) + "deg", transform: `rotate(${st.rot || 0}deg)` }}
      onPointerDown={onDown}
      onPointerMove={onMoveEv}
      onPointerUp={onUp}
    >
      {isImg ? <img src={st.content} alt="sticker" /> : st.content}
    </div>
  );
}

function StarsBg() {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    let stars = [];
    let raf;
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      stars = [];
      const count = Math.floor((canvas.width * canvas.height) / 11000);
      for (let i = 0; i < count; i++) {
        stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height * 0.75, r: Math.random() * 1.3 + 0.3, s: Math.random() * 0.02 + 0.005, phase: Math.random() * Math.PI * 2 });
      }
    }
    window.addEventListener("resize", resize);
    resize();
    function animate(t) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      stars.forEach((st) => {
        const alpha = 0.35 + 0.55 * Math.abs(Math.sin(t * st.s + st.phase));
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(animate);
    }
    raf = requestAnimationFrame(animate);
    return () => {
      window.removeEventListener("resize", resize);
      cancelAnimationFrame(raf);
    };
  }, []);
  return <canvas ref={canvasRef} style={{ position: "fixed", top: 0, left: 0, width: "100%", height: "100%", zIndex: 0, pointerEvents: "none" }} />;
}

      .polaroid-frame-none img{border-radius:10px;box-shadow:0 10px 22px rgba(0,0,0,0.35);}
      .polaroid .ph-loading{width:100%;height:110px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#888;background:#eee;border-radius:2px;}
      .polaroid .del{position:absolute;top:-8px;right:-8px;background:#0d1b3d;color:#fff;border:2px solid #fff;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:11px;}
      .empty-note{font-size:12.5px;opacity:0.55;text-align:center;padding:10px;width:100%;}
      .add-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center;}
      .add-row input, .gb-form input, .gb-form textarea, .add-row2 input, .add-row2 textarea{font-family:var(--font-body);background:rgba(255,255,255,0.08);color:var(--text);border:1px solid var(--glass-border);padding:9px 12px;border-radius:12px;}
      .add-row input{flex:1;min-width:180px;}
      .post{border-bottom:1px dashed var(--glass-border);padding:14px 0;}
      .post:last-child{border-bottom:none;}
      .post h3{font-family:var(--font-heading);font-size:19px;margin:0 0 4px;color:#fff;}
      .post .pdate{font-size:10.5px;opacity:0.5;margin-bottom:6px;letter-spacing:0.5px;}
      .post p{margin:0;font-size:13.5px;line-height:1.7;white-space:pre-wrap;}
      .add-row2{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
      .add-row2 input, .add-row2 textarea{width:100%;}
      .add-row2 textarea{min-height:60px;resize:vertical;}
      .friends{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;}
      .friend{text-align:center;font-size:11px;width:76px;}
      .friend img{width:60px;height:60px;object-fit:cover;border-radius:50%;border:2px solid var(--pale);margin-bottom:6px;background:#333;}
      .player{background:rgba(0,0,0,0.2);border:1px solid var(--glass-border);border-radius:18px;padding:14px 16px;}
      .marquee{overflow:hidden;white-space:nowrap;font-size:12px;color:var(--pale);border-bottom:1px dashed var(--glass-border);padding-bottom:8px;margin-bottom:8px;}
      .track{display:flex;justify-content:space-between;padding:7px 4px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.06);}
      .doodle-wrap canvas{width:100%;height:240px;display:block;border-radius:18px;background:rgba(255,255,255,0.06);border:1px solid var(--glass-border);touch-action:none;cursor:crosshair;}
      .doodle-tools{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;}
      .doodle-color{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,0.5);}
      .doodle-color.active{border-color:#fff;box-shadow:0 0 0 2px var(--pale);}
      .gb-entry{border-bottom:1px dashed var(--glass-border);padding:12px 0;font-size:13px;}
      .gb-name{color:#fff;font-weight:700;}
      .gb-date{opacity:0.5;font-size:10px;}
      .gb-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
      .gb-form input{flex:0 0 150px;}
      .gb-form textarea{flex:1;min-width:200px;resize:vertical;min-height:40px;}
      .settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;}
      .setting-item{font-size:11.5px;}
      .setting-item label{display:block;margin-bottom:5px;opacity:0.8;}
      .setting-item input[type=color]{width:100%;height:32px;border:1px solid var(--glass-border);background:none;padding:0;cursor:pointer;border-radius:8px;}
      .setting-item input[type=text]{width:100%;font-family:var(--font-body);background:rgba(255,255,255,0.08);color:var(--text);border:1px solid var(--glass-border);padding:8px 10px;border-radius:10px;}
      .swatches{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
      .swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,0.4);}
      footer{text-align:center;font-size:11px;opacity:0.5;margin-top:36px;font-family:var(--font-heading);font-style:italic;font-size:15px;}
    `}</style>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<BirthdayWorld />);
</script>
