<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>un piccolo mondo blu</title>

<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<!-- Babel (lets the browser understand the JSX below, no build step needed) -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
<!-- Firebase (compat SDK — simplest to use with plain <script> tags) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  html, body, #root { margin: 0; padding: 0; min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<div id="error-box" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:#ff4d4d; color:#fff; font-family:monospace; font-size:13px; padding:14px; white-space:pre-wrap; word-break:break-word; max-height:80vh; overflow:auto;"></div>
<script>
  function showError(msg) {
    var box = document.getElementById("error-box");
    box.style.display = "block";
    box.textContent += msg + "\n\n";
  }
  window.addEventListener("error", function (e) {
    showError("ERRORE: " + e.message + " (file: " + e.filename + ", riga: " + e.lineno + ")");
  });
  window.addEventListener("unhandledrejection", function (e) {
    showError("ERRORE PROMISE: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
</script>

<script>
  /* =====================================================================
     STEP 1 — PASTE YOUR FIREBASE CONFIG HERE
     Get this from: Firebase Console > Project Settings > Your apps > SDK setup
     ===================================================================== */
  const firebaseConfig = {
    apiKey: "AIzaSyAQSkbAC3W5dffKL4dmSkLNQ7nXxcxV91M",
    authDomain: "hbd-bbg.firebaseapp.com",
    projectId: "hbd-bbg",
    storageBucket: "hbd-bbg.firebasestorage.app",
    messagingSenderId: "397612519054",
    appId: "1:397612519054:web:e33d357ab82a16561803df"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Firestore doc IDs can't contain "/", so swap it out just in case.
  function safeId(key) {
    return key.replace(/\//g, "__");
  }

  // This mimics the same window.storage API the original artifact used,
  // but backed by Firestore instead of Claude's built-in storage.
  window.storage = {
    async get(key) {
      const snap = await db.collection("storage").doc(safeId(key)).get();
      if (!snap.exists) return null;
      return { key, value: snap.data().value, shared: true };
    },
    async set(key, value) {
      await db.collection("storage").doc(safeId(key)).set({
        value,
        updatedAt: Date.now(),
      });
      return { key, value, shared: true };
    },
    async delete(key) {
      await db.collection("storage").doc(safeId(key)).delete();
      return { key, deleted: true, shared: true };
    },
    async list(prefix) {
      const snap = await db.collection("storage").get();
      const keys = [];
      snap.forEach((doc) => {
        if (!prefix || doc.id.startsWith(safeId(prefix))) keys.push(doc.id);
      });
      return { keys, prefix, shared: true };
    },
  };
</script>

<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
